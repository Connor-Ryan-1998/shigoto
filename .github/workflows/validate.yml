name: Validate shigoto

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release tags to point to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: go-task/setup-task@v1
      - run: task web:install
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: task verify 2>&1 | tee verify.log
        shell: bash
      - run: task audit 2>&1 | tee audit.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-failure
          path: |
            verify.log
            audit.log
            web/test-results/
  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/connor-ryan-1998/shigoto
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Authenticate GHCR for publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified Shigoto images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Connor-Ryan-1998/shigoto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
  postgres-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PGVECTOR_VERSION: 0.8.7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/connor-ryan-1998/shigoto-postgres
          flavor: latest=false
          tags: |
            type=raw,value=18.6-pgvector${{ env.PGVECTOR_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern=v{{version}}
      - name: Authenticate GHCR for publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PostgreSQL with pgvector
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          platforms: linux/amd64,linux/arm64
          build-args: PGVECTOR_VERSION=${{ env.PGVECTOR_VERSION }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Connor-Ryan-1998/shigoto
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
