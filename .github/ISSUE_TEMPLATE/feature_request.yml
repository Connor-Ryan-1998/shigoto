name: Feature request
description: Describe a problem Shigoto could solve.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution and alternatives
      description: Keep the smallest useful change in mind.
