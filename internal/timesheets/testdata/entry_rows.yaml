- name: valid_row
  rows: [{num: 2, values: {date: "2025-03-03", hours: "7.5", project: " Website ", task: Build, person: Me@Example.com, invoice: ACC-1, note: " did things "}}]
  want: [{row: 2, date: "2025-03-03", minutes: 450, project: Website, task: Build, person: Me@Example.com, invoice: ACC-1, note: did things}]
- name: quarter_hour
  rows: [{num: 2, values: {date: "2025-03-03", hours: "0.25", project: P, task: T, person: a@b.c, invoice: I}}]
  want: [{row: 2, date: "2025-03-03", minutes: 15, project: P, task: T, person: a@b.c, invoice: I, note: ""}]
- name: colon_hours_invalid
  rows: [{num: 2, values: {date: "2025-03-03", hours: "8:30", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: hours, message: invalid hours}]
- name: exponent_hours_invalid
  rows: [{num: 2, values: {date: "2025-03-03", hours: "1e1", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: hours, message: invalid hours}]
- name: too_many_hours
  rows: [{num: 2, values: {date: "2025-03-03", hours: "25", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: hours, message: hours must be more than 0 and at most 24}]
- name: zero_hours
  rows: [{num: 2, values: {date: "2025-03-03", hours: "0", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: hours, message: hours must be more than 0 and at most 24}]
- name: future_date
  rows: [{num: 2, values: {date: "2025-06-02", hours: "1", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: date, message: date is in the future}]
- name: invalid_date
  rows: [{num: 2, values: {date: "3/3/25", hours: "1", project: P, task: T, person: a@b.c, invoice: I}}]
  problems: [{row: 2, field: date, message: invalid date}]
- name: long_note
  rows: [{num: 2, values: {date: "2025-03-03", hours: "1", project: P, task: T, person: a@b.c, invoice: I, note: LONGNOTE}}]
  problems: [{row: 2, field: note, message: note must be at most 1000 characters}]
- name: blank_required
  rows: [{num: 2, values: {date: "2025-03-03", hours: "1", project: "", task: "", person: "", invoice: ""}}]
  problems:
    - {row: 2, field: project, message: project is required}
    - {row: 2, field: task, message: task is required}
    - {row: 2, field: person, message: person is required}
    - {row: 2, field: invoice, message: invoice number is required}
