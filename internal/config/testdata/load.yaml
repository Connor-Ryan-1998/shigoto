# Load(getenv) cases. The adapter starts every case from a valid base env:
#   SHIGOTO_DATABASE_URL=postgres://x
#   SHIGOTO_BASE_URL=http://localhost:8080
# and applies `env` on top (an empty value unsets a variable). Each case has
# exactly one of `want` (fields to check; omitted fields are not checked) or
# `err` (a substring the error must contain).
- name: defaults
  want:
    listen: ":8080"
    modules: [property, timesheets, reconciliation]
    timezone: Australia/Brisbane
    scheduler: true
    smtp_host: ""
    trusted_proxy: ""
    oidc_configured: false
    upload_max_bytes: 1073741824
    upload_min_free_bytes: 5368709120
    storage: disk
    llm_configured: false
    embed_configured: false

- name: unknown module rejected
  env: {SHIGOTO_MODULES: "property,payroll"}
  err: payroll

- name: database URL required
  env: {SHIGOTO_DATABASE_URL: ""}
  err: SHIGOTO_DATABASE_URL

- name: base URL required
  env: {SHIGOTO_BASE_URL: ""}
  err: SHIGOTO_BASE_URL

- name: base URL trailing slash trimmed
  env: {SHIGOTO_BASE_URL: "https://shigoto.example/"}
  want: {base_url: "https://shigoto.example"}

- name: base URL without scheme rejected
  env: {SHIGOTO_BASE_URL: not-a-url}
  err: SHIGOTO_BASE_URL

- name: base URL with ftp scheme rejected
  env: {SHIGOTO_BASE_URL: "ftp://example.com"}
  err: SHIGOTO_BASE_URL

- name: base URL without host rejected
  env: {SHIGOTO_BASE_URL: "http://"}
  err: SHIGOTO_BASE_URL

- name: base URL with a space rejected
  env: {SHIGOTO_BASE_URL: "https:// has a space"}
  err: SHIGOTO_BASE_URL

- name: modules subset
  env: {SHIGOTO_MODULES: timesheets}
  want: {modules: [timesheets]}

- name: empty module entries ignored
  env: {SHIGOTO_MODULES: "property,"}
  want: {modules: [property]}

- name: invalid timezone rejected
  env: {SHIGOTO_TIMEZONE: Not/AZone}
  err: Not/AZone

- name: scheduler off
  env: {SHIGOTO_SCHEDULER: "off"}
  want: {scheduler: false}

- name: invalid scheduler value rejected
  env: {SHIGOTO_SCHEDULER: maybe}
  err: SHIGOTO_SCHEDULER

- name: SMTP TLS defaults to starttls
  env: {SHIGOTO_SMTP_HOST: smtp.example.com, SHIGOTO_SMTP_FROM: noreply@example.com}
  want: {smtp_tls: starttls}

- name: SMTP TLS none rejected for a real host
  env: {SHIGOTO_SMTP_HOST: smtp.example.com, SHIGOTO_SMTP_FROM: noreply@example.com, SHIGOTO_SMTP_TLS: none}
  err: SHIGOTO_SMTP_TLS

- name: SMTP TLS none allowed for mailpit
  env: {SHIGOTO_SMTP_HOST: mailpit, SHIGOTO_SMTP_FROM: noreply@example.com, SHIGOTO_SMTP_TLS: none}
  want: {smtp_tls: none}

- name: SMTP host without from address rejected
  env: {SHIGOTO_SMTP_HOST: smtp.example.com}
  err: SHIGOTO_SMTP_FROM

- name: trusted proxy CIDR parsed
  env: {SHIGOTO_TRUSTED_PROXY: 10.0.0.0/8}
  want: {trusted_proxy: 10.0.0.0/8}

- name: invalid trusted proxy rejected
  env: {SHIGOTO_TRUSTED_PROXY: not-a-cidr}
  err: SHIGOTO_TRUSTED_PROXY

- name: partial OIDC config rejected
  env: {SHIGOTO_OIDC_ISSUER: "https://idp.example.com", SHIGOTO_OIDC_CLIENT_ID: shigoto}
  err: SHIGOTO_OIDC_CLIENT_SECRET

- name: OIDC default scopes
  env:
    SHIGOTO_OIDC_ISSUER: "https://idp.example.com"
    SHIGOTO_OIDC_CLIENT_ID: shigoto
    SHIGOTO_OIDC_CLIENT_SECRET: secret
  want:
    oidc_configured: true
    oidc_scopes: [openid, email, profile]

- name: upload max zero means unlimited
  env: {SHIGOTO_UPLOAD_MAX_BYTES: "0"}
  want: {upload_max_bytes: 0}

- name: upload max custom
  env: {SHIGOTO_UPLOAD_MAX_BYTES: "2147483648", SHIGOTO_UPLOAD_MIN_FREE_BYTES: "0"}
  want: {upload_max_bytes: 2147483648, upload_min_free_bytes: 0}

- name: upload max negative rejected
  env: {SHIGOTO_UPLOAD_MAX_BYTES: "-1"}
  err: SHIGOTO_UPLOAD_MAX_BYTES

- name: upload max not a number rejected
  env: {SHIGOTO_UPLOAD_MAX_BYTES: abc}
  err: SHIGOTO_UPLOAD_MAX_BYTES

- name: upload min free negative rejected
  env: {SHIGOTO_UPLOAD_MIN_FREE_BYTES: "-5"}
  err: SHIGOTO_UPLOAD_MIN_FREE_BYTES

- name: storage s3 full
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s}
  want:
    storage: s3
    s3_endpoint: "http://storage:8333"
    s3_region: auto
    s3_bucket: shigoto
    s3_path_style: true
    s3_prefix: ""

- name: storage s3 overrides
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s, SHIGOTO_S3_REGION: ap-sydney-1, SHIGOTO_S3_PATH_STYLE: "false", SHIGOTO_S3_PREFIX: prod}
  want:
    storage: s3
    s3_region: ap-sydney-1
    s3_path_style: false
    s3_prefix: prod/

- name: storage s3 prefix keeps trailing slash
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s, SHIGOTO_S3_PREFIX: prod/}
  want:
    s3_prefix: prod/

- name: unknown storage rejected
  env: {SHIGOTO_STORAGE: gcs}
  err: SHIGOTO_STORAGE

- name: s3 endpoint required
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s}
  err: SHIGOTO_S3_ENDPOINT

- name: s3 bucket required
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: "", SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s}
  err: SHIGOTO_S3_BUCKET

- name: s3 access key required
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: "", SHIGOTO_S3_SECRET_ACCESS_KEY: s}
  err: SHIGOTO_S3_ACCESS_KEY_ID

- name: s3 secret key required
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: ""}
  err: SHIGOTO_S3_SECRET_ACCESS_KEY

- name: s3 endpoint must be absolute URL
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s}
  err: SHIGOTO_S3_ENDPOINT

- name: s3 path style must be boolean
  env: {SHIGOTO_STORAGE: s3, SHIGOTO_S3_ENDPOINT: "http://storage:8333", SHIGOTO_S3_BUCKET: shigoto, SHIGOTO_S3_ACCESS_KEY_ID: k, SHIGOTO_S3_SECRET_ACCESS_KEY: s, SHIGOTO_S3_PATH_STYLE: maybe}
  err: SHIGOTO_S3_PATH_STYLE

- name: disk ignores s3 vars
  env: {SHIGOTO_S3_ENDPOINT: nonsense}
  want:
    storage: disk

- name: LLM group configures the strata assistant
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: deepseek/deepseek-v4.1-flash
  want:
    llm_configured: true
    llm_model: deepseek/deepseek-v4.1-flash
    llm_extract_model: deepseek/deepseek-v4.1-flash
    llm_pdf_mode: file
    embed_configured: false

- name: LLM extract model overrides the agent model
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: a
    SHIGOTO_LLM_EXTRACT_MODEL: b
  want: {llm_model: a, llm_extract_model: b}

- name: partial LLM group rejected
  env: {SHIGOTO_LLM_MODEL: deepseek/deepseek-v4.1-flash}
  err: SHIGOTO_LLM

- name: LLM image PDF mode is reserved
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
    SHIGOTO_LLM_PDF_MODE: image
  err: reserved

- name: unknown LLM PDF mode rejected
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
    SHIGOTO_LLM_PDF_MODE: bogus
  err: SHIGOTO_LLM_PDF_MODE

- name: LLM base URL must be http(s)
  env:
    SHIGOTO_LLM_BASE_URL: ftp://x
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
  err: SHIGOTO_LLM_BASE_URL

- name: embed group configures embeddings
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
    SHIGOTO_EMBED_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
    SHIGOTO_EMBED_API_KEY: g
    SHIGOTO_EMBED_MODEL: gemini-embedding-2
  want: {llm_configured: true, embed_configured: true, embed_model: gemini-embedding-2}

- name: partial embed group rejected
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
    SHIGOTO_EMBED_MODEL: gemini-embedding-2
  err: SHIGOTO_EMBED

- name: embed group without LLM group rejected
  env:
    SHIGOTO_EMBED_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
    SHIGOTO_EMBED_API_KEY: g
    SHIGOTO_EMBED_MODEL: gemini-embedding-2
  err: SHIGOTO_EMBED

- name: embed base URL must be http(s)
  env:
    SHIGOTO_LLM_BASE_URL: https://openrouter.ai/api/v1
    SHIGOTO_LLM_API_KEY: k
    SHIGOTO_LLM_MODEL: m
    SHIGOTO_EMBED_BASE_URL: not-a-url
    SHIGOTO_EMBED_API_KEY: g
    SHIGOTO_EMBED_MODEL: e
  err: SHIGOTO_EMBED_BASE_URL

- name: empty assistant settings from local Compose leave it disabled
  env:
    SHIGOTO_LLM_BASE_URL: ""
    SHIGOTO_LLM_API_KEY: ""
    SHIGOTO_LLM_MODEL: ""
    SHIGOTO_LLM_PDF_MODE: file
    SHIGOTO_EMBED_BASE_URL: ""
  want: {llm_configured: false, embed_configured: false}
