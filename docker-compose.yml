services:
  db:
    build: deploy/postgres
    image: shigoto-postgres:dev
    environment:
      POSTGRES_USER: shigoto
      POSTGRES_PASSWORD: shigoto
      POSTGRES_DB: shigoto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shigoto -d shigoto"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # Same digest-pinned release as ansible/roles/shigoto/defaults/main.yml.
    # No -s3.config: anonymous access is fine for local dev and tests.
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["server", "-s3", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHIGOTO_LISTEN: ":8080"
      SHIGOTO_DATABASE_URL: "postgres://shigoto:shigoto@db:5432/shigoto?sslmode=disable"
      SHIGOTO_BASE_URL: "http://localhost:8080"
      SHIGOTO_FILES_DIR: "/data/files"
      SHIGOTO_SMTP_HOST: "mailpit"
      SHIGOTO_SMTP_PORT: "1025"
      SHIGOTO_SMTP_FROM: "noreply@shigoto.local"
      SHIGOTO_SMTP_TLS: "none"
      # Optional strata assistant, read from the git-ignored .env next to
      # this file; empty values leave the assistant disabled.
      SHIGOTO_LLM_BASE_URL: "${SHIGOTO_LLM_BASE_URL:-}"
      SHIGOTO_LLM_API_KEY: "${SHIGOTO_LLM_API_KEY:-}"
      SHIGOTO_LLM_MODEL: "${SHIGOTO_LLM_MODEL:-}"
      SHIGOTO_LLM_EXTRACT_MODEL: "${SHIGOTO_LLM_EXTRACT_MODEL:-}"
      SHIGOTO_LLM_PDF_MODE: "${SHIGOTO_LLM_PDF_MODE:-file}"
      SHIGOTO_EMBED_BASE_URL: "${SHIGOTO_EMBED_BASE_URL:-}"
      SHIGOTO_EMBED_API_KEY: "${SHIGOTO_EMBED_API_KEY:-}"
      SHIGOTO_EMBED_MODEL: "${SHIGOTO_EMBED_MODEL:-}"
      SHIGOTO_EMBED_QUERY_PREFIX: "${SHIGOTO_EMBED_QUERY_PREFIX:-}"
      SHIGOTO_EMBED_DOCUMENT_PREFIX: "${SHIGOTO_EMBED_DOCUMENT_PREFIX:-}"
    volumes:
      - files:/data/files
    ports:
      - "8080:8080"

volumes:
  pgdata:
  files:
  seaweedfs:
